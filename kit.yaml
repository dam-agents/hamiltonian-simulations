# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# This public DAM starter kit seeds its own kit.yaml and ONBOARDING.md into the
# agent's home directory. The GHE seed cannot land, so the first session clones
# lahs-agentic-workflows into ~/work/lahs-agentic-workflows and runs
# bin/dam-setup setup there; the GHE skills are installed from that repo.
schemaVersion: v1
id: lahs-workflows-runner
name: Hamiltonian Simulations
tagline: Run Hamiltonian simulation workflows on IBM Quantum hardware.
description: >-
  Runs lahs-workflows pipelines on the deployed lahs-workflows Qiskit Function.
  Onboarding first clones the GHE checkout and runs bin/dam-setup to update both
  repositories, then checks that the agent can read the LAHS repositories on
  github.ibm.com, guides you through saving your IBM Quantum account and
  confirms the deployed functions.
category: research
icon: microscope
docsUrl: https://github.ibm.com/LAHS/lahs-agentic-workflows
harnesses: [claude-code, codex, pi, bob]

connections:
  - accepts: [github-enterprise]
    required: true
    note: Requires read access to LAHS/lahs-agentic-workflows and LAHS/lahs-workflows on github.ibm.com.

# The public kit repo has no skills of its own: install the agentic and
# lahs-workflows skills from their GHE sources. Both repositories expose their
# skills under skills/ at the repository root, so each source is the repository
# URL (no tree or subdirectory URL). The platform installs these only from
# sources that already exist; ONBOARDING step 3 has the user add both sources
# and installs all seven for a user who has neither.
skills:
  - source: https://github.ibm.com/LAHS/lahs-agentic-workflows
    name: connect-cluster
  - source: https://github.ibm.com/LAHS/lahs-agentic-workflows
    name: preflight
  - source: https://github.ibm.com/LAHS/lahs-agentic-workflows
    name: run-workflow
  - source: https://github.ibm.com/LAHS/lahs-agentic-workflows
    name: report-run
  - source: https://github.ibm.com/LAHS/lahs-workflows
    name: run-lahs-workflow
  - source: https://github.ibm.com/LAHS/lahs-workflows
    name: run-qiskit-function
  - source: https://github.ibm.com/LAHS/lahs-workflows
    name: analyse-sweep

# Seed the public kit metadata; the GHE checkout is cloned by onboarding.
seed:
  self: true
  into: home

egressPreset: trusted
egressRules:
  - host: github.ibm.com
  - host: cdnjs.cloudflare.com
  - host: cdn.jsdelivr.net
  - host: cloud.ibm.com
  - host: iam.cloud.ibm.com
  - host: resource-controller.cloud.ibm.com
  - host: api.global-search-tagging.cloud.ibm.com
  - host: globalcatalog.cloud.ibm.com
  - host: quantum.cloud.ibm.com
  - host: eu-de.quantum.cloud.ibm.com
  - host: qiskit-serverless.quantum.ibm.com
  - host: s3.us-east.cloud-object-storage.appdomain.cloud
  - host: s3.eu-de.cloud-object-storage.appdomain.cloud

# The first turn of a new agent. Every step in ONBOARDING.md is safe to re-run.
onboarding:
  prompt: >-
    Read ONBOARDING.md in your home directory (the public kit seed) and follow it.
    First clone https://github.ibm.com/LAHS/lahs-agentic-workflows.git into
    ~/work/lahs-agentic-workflows and run bin/dam-setup setup there to update both
    repositories and install the tooling; use only `uv run --no-project --with …` here and never
    bare `uv run`/`uv sync` from the checkout. Then check GitHub access, install the
    seven skills from both repositories, guide the user through saving their IBM
    Quantum account (Qiskit Functions CRN and API key,
    typed into a hidden prompt in DAM's Terminal (browser) or a local shell), and
    confirm the deployed Qiskit Functions. Only mark the function step complete
    after both titles load; leave it open on a network error or 503. Explain the
    skills at the end.
